name: Refresh dashboard data

on:
  schedule:
    # Twice monthly, timed to official release calendars (times are UTC).
    # 16th ~06:00 UTC — Commerce Ministry publishes monthly trade around the 15th IST.
    - cron: "0 6 16 * *"
    # 29th ~06:00 UTC — NSO publishes IIP Quick Estimates around the 28th IST.
    - cron: "0 6 29 * *"
  workflow_dispatch: {} # lets you trigger a refresh manually from the Actions tab

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Fetch latest official data
        env:
          DATAGOVIN_API_KEY: ${{ secrets.DATAGOVIN_API_KEY }}
        run: python scripts/fetch_data.py

      - name: Commit updated data
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/latest.json data/history.json
          if git diff --staged --quiet; then
            echo "No data changes — nothing to commit."
          else
            git commit -m "data: refresh $(date -u +'%Y-%m-%d')"
            git push
          fi
